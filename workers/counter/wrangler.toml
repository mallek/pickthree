name = "pickthree-counter"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://pick3.gg,https://www.pick3.gg,http://localhost:5173,http://localhost:4173"

# meta.pick3.gg is this worker's static assets. The API paths run the worker first; everything
# else is the site, with the SPA fallback so /great/p/azumarill loads index.html.
[assets]
directory = "../../apps/meta/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*",
  "/hit",
  "/count",
  "/error",
  "/errors",
  "/battles",
  "/meta",
]

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[durable_objects.bindings]]
name = "META"
class_name = "MetaStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MetaStore"]
