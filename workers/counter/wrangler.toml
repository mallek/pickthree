name = "pickthree-counter"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# INGEST_TOKEN, the bearer token for the tournament ingest routes (PUT/POST/DELETE
# /api/v1/events/...), is a secret, not a var: set it with `wrangler secret put INGEST_TOKEN`,
# the same way ERRORS_READ_TOKEN is set. It never appears in this file.
[vars]
ALLOWED_ORIGINS = "https://pick3.gg,https://www.pick3.gg,http://localhost:5173,http://localhost:4173"

# meta.pick3.gg (a Custom Domain on this worker, attached in the Cloudflare dashboard) retired
# into pick3's Meta tab. There are no static assets: the API paths answer as before and every
# other path redirects to its pick3 route (src/redirect.ts).

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[durable_objects.bindings]]
name = "META"
class_name = "MetaStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MetaStore"]
