name: worker and meta site
on:
  push:
    branches: [main]
    paths:
      - 'workers/counter/**'
      - 'apps/meta/**'
      - 'packages/data/pvpoke.lock.json'
      - 'packages/data/seasons.json'
      - '.github/workflows/counter.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm -w @pickthree/counter run typecheck
      - name: Cache PvPoke checkout
        uses: actions/cache@v4
        with:
          path: |
            packages/data/.pvpoke
            packages/data/.cache
          key: pvpoke-${{ hashFiles('packages/data/pvpoke.lock.json') }}
      - name: Cache built game data
        id: data
        uses: actions/cache@v4
        with:
          path: apps/web/public/data
          key: data-${{ hashFiles('packages/data/pvpoke.lock.json', 'packages/data/seasons.json', 'packages/data/src/**', 'packages/engine/src/gamedata/**', 'packages/sim-pvpoke/src/**') }}
      - run: npm run data:fetch
        if: steps.data.outputs.cache-hit != 'true'
      - run: npm run data:build
        if: steps.data.outputs.cache-hit != 'true'
      # The worker serves apps/meta/dist as its static assets, so the site is built first. A
      # deploy without that directory present would publish an empty asset set and blank the live
      # site, so this order matters more than anything else in this file.
      - run: npm -w @pickthree/meta run build
      - run: npm -w @pickthree/counter run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set the error log read token
        run: printf '%s' "$ERRORS_READ_TOKEN" | npx wrangler secret put ERRORS_READ_TOKEN --name pickthree-counter
        working-directory: workers/counter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ERRORS_READ_TOKEN: ${{ secrets.ERRORS_READ_TOKEN }}
