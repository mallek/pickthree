# Known differences between our battle engine and PvPoke's simulator (the rules exam's grader).
# packages/data/test/exam/rules-exam.test.ts plays every script in packages/data/src/exam/scripts.ts
# through both engines and compares HP and energy turn by turn. A script that differs passes only when
# an entry here lists it with the first difference the script shows: `first` is the field and side of
# the first differing trace value (hp[0], energy[1], forms[1]), or turn, length or executed (see
# packages/data/src/exam/judge.ts). A new bug that shows before the known divergence moves the first
# difference and fails the exam. `first: later` lists a script whose first difference another entry
# owns, for a difference that shows only after it; it explains nothing alone. Past the first
# difference the traces differ everywhere, so the exam checks nothing there. An entry that lists a
# script which now matches is reported stale and fails the exam, like a redundant override. Each entry names the behaviour, what each engine does, and the
# evidence for our side. An entry with `scripts: []` documents a difference no exam script exercises
# (the exam runs our engine on PvPoke's converted data and a transcription of PvPoke's mechanics): it
# explains no script and is never stale, but needs the same fields and evidence.
#
# Cites: PvPoke at the pinned commit (packages/data/.pvpoke/src/js; the vendored copies in
# packages/sim-pvpoke/vendor are byte for byte the same): Battle.js and pokemon/Pokemon.js.
# Ours: packages/battle/src.
#
# Checked and NOT a difference (no entry, the exam scripts match):
#   - Gulp Missile: PvPoke queues it as the next action of the turn (Battle.js:1591-1625), ours fires
#     it inside the charged move that triggered it. Both resolve it before the other side's queued
#     charged move, so cramorant-gulping, cramorant-mirror-surf and cramorant-gorging match.
#   - Cramorant mirror priority: PvPoke forces usePriority for cramorant vs cramorant (Battle.js:262-264).
#     With equal Attack its only effect is the knockout skip at Battle.js:479, which ours always does,
#     so cmp-tie-ko-cramorant matches.
#   - Charged move priority uses form Attack without the shadow multiplier or stat stages in both
#     (Battle.js:262 and :783 read stats.atk; Pokemon.js:2258-2263 keeps the shadow bonus in
#     shadowAtkMult). cmp-tie-shadow shows PvPoke treating a shadow vs plain pair with equal IVs as a tie.
#   - Timeout in the exam: PvPoke stops at 240000 ms (Battle.js:636) counting 10000 ms per charged
#     move; ours, on the converted exam data, at 480 turns (convert.ts ROUND_TURNS). Every exam script
#     ends in a knockout well before either clock (rules-exam.test.ts asserts it), so no script
#     exercises this. Real data uses 540 turns: see round-length below.

differences:
  - id: cmp-tie-knockout
    behaviour: >-
      Both sides throw a charged move on the same turn with equal Attack, and the first move to
      resolve knocks the other side out.
    ours: >-
      The tie goes to the side the RandomSource names (scripts: side 0). That move resolves first, and
      the knocked-out side's charged move is skipped, whether or not Attack decided the order
      (packages/battle/src/rules/turn.ts:107, faintSource 'charged').
    pvpoke: >-
      With equal Attack, usePriority is false (Battle.js:259-265), and the knocked-out thrower is
      skipped only when usePriority is true (Battle.js:478-481), so both moves resolve: the second
      side throws from 0 HP and the battle ends in a double knockout.
    evidence: >-
      Spec decision of 2026-10-27 (docs/superpowers/specs/2026-10-27-battle-engine-foundation-design.md
      and the plan's 'CMP tie with a knockout'): a CMP tie is a caller-supplied random outcome and a
      Pokemon knocked out by the winner's move does not act, as in the game. PvPoke itself skips a
      charged-move-fainted thrower whenever it resolves an order (Battle.js:478-481: 'Check if knocked
      out from a priority move'), and skips a fast move from a Pokemon knocked out by a charged move
      regardless of priority (Battle.js:451-461); its equal-Attack path lets both charged moves resolve
      so a simulation needs no coin flip.
      Exam: cmp-tie-ko and cmp-tie-shadow, turn of the tie, PvPoke executes the second side's entry and
      ours does not.
    scripts:
      - { id: cmp-tie-ko, first: 'hp[0]' }
      - { id: cmp-tie-shadow, first: 'hp[0]' }

  - id: form-change-relevel
    behaviour: >-
      Attack and Defense after a form change between forms with different base stats (Aegislash
      Shield and Blade, Minior Core and Meteor).
    ours: >-
      switchForm keeps level and IVs and recomputes Attack and Defense from the new form's base stats
      at the same level (packages/battle/src/rules/mechanics.ts:52-60). HP is kept.
    pvpoke: >-
      changeForm calls getFormStats (Pokemon.js:2486-2491, :2528-2616), which at battle CP 1500 or 2500
      maps the level to the new form (Blade at ceil(level * 0.5) + 1 in Great League, Meteor by
      floor((47 * level / 25 + 1) * 2) / 2 credited to u/Ok_Lobster8494), then steps the level down
      until the form fits the CP cap. HP is kept. Going back to the starting form uses the original level.
    evidence: >-
      Plan decision 'Form stats' (docs/superpowers/plans/2026-10-27-battle-engine-foundation.md): the
      datamine (8e227be) carries only base stats for AEGISLASH_BLADE / AEGISLASH_SHIELD and the
      MINIOR forms, no level mapping, and the vocabulary has no effect that changes level. Checked by
      rules-exam.test.ts ('raising PvPoke battle CP past the caps removes the form re-level
      divergence'): with PvPoke's battle CP at 10000 (getFormStats keeps the level) the aegislash script
      matches turn for turn, so the level mapping is the whole difference there. The form mechanics
      themselves are compared without it by aegislash-same-level (level 3, where the Blade mapping is
      the same level) and minior-core-same-level (PvPoke battle CP 10000), which match.
      Open for the brainstorm lane: PvPoke's mappings are community-derived from observed in-game
      stats, so the game may be on PvPoke's side; a fix needs a vocabulary change, not an exam change.
    scripts:
      - { id: aegislash, first: 'hp[0]' }
      - { id: minior-core, first: 'hp[1]' }

  - id: minior-hp-form-timing
    behaviour: >-
      Minior Meteor changing into Core below half HP while one side's fast move is still in flight.
    ours: >-
      The hpBelow rule switches the form inside the hit that crossed half HP and nothing else changes:
      cooldowns run on (pvpoke-mechanics.yaml has no animate for it, and an animate would freeze turns,
      which PvPoke does not do).
    pvpoke: >-
      The hp form change sets roundFormAnimation (Battle.js:1644-1670), which resets both Pokemon's
      cooldown to 500 ms at the end of the turn like a charged move (Battle.js:546-550), and adds
      animationTime 5000 ms to its clock (Battle.js:1649, :1670). A Minior part way through a 3-turn
      fast move gets its next decision early, shifting its fast move cadence.
    evidence: >-
      Plan seed for this list (the transcription in pvpoke-mechanics.yaml cannot express a cooldown
      reset without frozen turns). Our shipped mechanics.yaml models Minior's change as an animation of
      frozen turns, like the datamine's ibfc animationDurationTurns: 5 on Mimikyu, Aegislash and
      Morpeko, not as a cooldown reset. Checked by rules-exam.test.ts (same test as
      form-change-relevel): with PvPoke's battle CP at 10000 (no re-level) minior-core matches until
      after Minior turns Core on a turn when its Take Down is mid-move; PvPoke's Minior is then not free
      on the turn ours throws Power Gem. minior-core-same-level shows the hp trigger itself matching
      when the crossing hit lands on the turn Minior's own 3-turn Rollout resolves, so no fast move is
      in flight (a property of its levels and IVs, guarded by rules-exam.test.ts).
      In minior-core the re-level (form-change-relevel) shows first, so this entry is listed as later.
    scripts:
      - { id: minior-core, first: later }

  # Documentation entries: real differences the exam does not exercise.

  - id: animation-turns
    behaviour: >-
      The animation when Mimikyu busts, Aegislash changes stance, Morpeko changes mode, or Minior
      turns Core.
    ours: >-
      The animate effect freezes the battle for 5 turns after the turn it fires: the turn counter
      advances, nothing else happens (packages/battle/src/rules/turn.ts:69-74; mechanics.yaml animate
      turns 5 on mimikyu, aegislash, morpeko and minior).
    pvpoke: >-
      No turn cost for Mimikyu, Aegislash or Morpeko (Battle.js:1029-1040, :1205-1206, :1281-1300,
      :1555-1584 change form only). Only an hp-triggered change (Minior) adds animationTime 5000 ms to
      its clock and resets both cooldowns like a charged move (Battle.js:1649, :1668-1670, :548-550;
      pokemon.json:38563).
    evidence: >-
      Datamine 8e227be ibfc animationDurationTurns 5 in both directions on V0681_POKEMON_AEGISLASH
      (lines 469415, 469420), V0778_POKEMON_MIMIKYU (491340, 491345) and V0877_POKEMON_MORPEKO
      (509738, 509745). Minior has no ibfc flag; its 5 turns are a guess (mechanics.yaml source).
      Recorded-battle evidence for the exact freeze semantics is still wanted.
    scripts: []

  - id: morpeko-toggle
    behaviour: Morpeko's form and Aura Wheel after its second and later charged moves.
    ours: >-
      Toggles on every charged move, Full Belly to Hangry and back, swapping AURA_WHEEL_ELECTRIC and
      AURA_WHEEL_DARK (packages/data/battle/mechanics.yaml:52-66).
    pvpoke: >-
      Changes Full Belly to Hangry once and never back: morpeko_hangry has no formChange of its own
      (pokemon.json:41577-41598), changeForm keeps Full Belly's (Pokemon.js:2482-2484), whose target
      is Hangry, so the activeFormId check at Battle.js:1573 never passes again.
    evidence: >-
      Datamine 8e227be V0877_POKEMON_MORPEKO ibfc carries both defaultToAlternateIbfcSettings and
      alternateToDefaultIbfcSettings (lines 509738, 509745); the game toggles. The exam's
      transcription (packages/data/src/exam/pvpoke-mechanics.yaml:86-101) follows PvPoke, so the
      morpeko script matches.
    scripts: []

  - id: mega-damage-bonus
    behaviour: Damage from a Mega Pokemon's charged moves.
    ours: >-
      No Mega multiplier: damage is the plain formula (packages/battle/src/rules/damage.ts:44). Mega
      forms and Mega moves are extracted as data only (packages/battle/src/extract/species.ts:177-210).
    pvpoke: >-
      Multiplies a Mega's Mega-move damage by MEGA_BONUS[megaLevel - 1], 1 to 1.3
      (DamageCalculator.js:10, :40-41, :68, :87-88, :104).
    evidence: >-
      Plan decision 'Megas' (docs/superpowers/plans/2026-10-27-battle-engine-foundation.md): the bonus
      is not modelled in this slice, it belongs to cup readiness (spec 4). Not a claim that the game
      lacks it. No exam script uses a Mega.
    scripts: []

  - id: round-length
    behaviour: When a battle times out.
    ours: >-
      After settings.roundTurns turns, roundDurationSeconds / turnDurationSeconds from the datamine
      (packages/battle/src/extract/settings.ts:79; packages/battle/src/rules/turn.ts:18): 270 / 0.5 =
      540 turns. A turn with a charged move is one turn.
    pvpoke: >-
      Stops once its clock passes 240000 ms (Battle.js:636), 480 turns of 500 ms, and a turn with a
      charged move adds chargedMinigameTime 10000 ms instead of 500 (Battle.js:58, :504-514).
    evidence: >-
      Datamine 8e227be combat settings roundDurationSeconds 270.0 and turnDurationSeconds 0.5
      (lines 95025-95026). Whether the game's clock pauses for the charged move minigame is not
      settled here. Datamine 540, PvPoke 480, what the field means is unverified: 480 turns is
      exactly 4:00 at 0.5s per turn and 540 is 4:30, so the extra 30s may be an intro or charged-move
      pause allowance rather than battle clock. Ruling: keep 540 in the data and have the engine use
      it. To settle first-hand, time one GBL match that goes to timeout. Matters only once spec 2 runs
      real battles to the clock.
    scripts: []

  - id: shedinja-hp
    behaviour: Shedinja's HP.
    ours: >-
      The general formula, max(10, floor((base hp + hp IV) * cpm)) on base stamina 1
      (packages/battle/src/rules/stats.ts:39): with 15 HP IV, 10 at level 20, 11 at level 30, 13 at
      level 50.
    pvpoke: Always 10 (Pokemon.js:384-388, special case on dex 292).
    evidence: >-
      Datamine 8e227be V0292_POKEMON_SHEDINJA baseStamina 1 (line 367771) with no special case, so ours follows the
      game master's formula. Unconfirmed against the game: a recorded Shedinja's HP at a high level
      would settle it.
    scripts: []
