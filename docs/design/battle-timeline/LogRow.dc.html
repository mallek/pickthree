<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-19a3dbd9-7e83-4f60-b0a9-98f02ecd821d/styles.css">
<script src="_ds/nocturne-19a3dbd9-7e83-4f60-b0a9-98f02ecd821d/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;flex-direction:column;gap:8px;padding:10px 14px;font-family:var(--font-body);color:var(--color-text)">
  <div style="display:grid;grid-template-columns:54px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start">
    <div style="display:flex;flex-direction:column;gap:3px;align-items:flex-start">
      <span style="font-size:11px;font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--color-text) 70%,transparent)">{{ r.tTxt }}</span>
      <button onClick="{{ r.onHash }}" title="Show full state" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;letter-spacing:.04em;padding:3px 5px;border-radius:4px;border:1px solid var(--color-accent-700);background:var(--color-accent-900);color:var(--color-accent-300);cursor:pointer" style-hover="background:var(--color-accent-800)">{{ r.hash }}</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:5px;min-width:0">
      <sc-if value="{{ r.me.has }}" hint-placeholder-val="{{ true }}">
        <div style="{{ r.me.box }}">
          <sc-if value="{{ r.me.hasSpr }}"><img src="{{ r.me.spr }}" alt="" style="width:32px;height:32px;margin:-9px -4px -9px -6px;flex:none;object-fit:contain"></sc-if>
          <sc-if value="{{ r.me.hasDot }}"><span style="{{ r.me.dot }}"></span></sc-if>
          <sc-if value="{{ r.me.hasIcon }}"><i class="{{ r.me.icon }}" style="font-size:15px;flex:none"></i></sc-if>
          <span style="font-size:12.5px;font-weight:500;line-height:1.25">{{ r.me.title }}</span>
        </div>
      </sc-if>
      <sc-if value="{{ r.me.hasSub }}"><div style="font-size:11px;line-height:1.3;color:color-mix(in srgb,var(--color-text) 65%,transparent)">{{ r.me.sub }}</div></sc-if>
      <sc-if value="{{ r.me.hasFaint }}"><div style="display:flex;gap:4px;align-items:center;font-size:11px;color:color-mix(in srgb,var(--color-text) 80%,transparent)"><i class="ph ph-x-circle" style="font-size:13px"></i>{{ r.me.faint }}</div></sc-if>
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="display:flex;justify-content:space-between;gap:6px;font-size:10.5px;font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--color-text) 60%,transparent)"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.me.mon }}</span><span style="white-space:nowrap">{{ r.me.nums }}</span></div>
        <div style="height:4px;border-radius:2px;background:color-mix(in srgb,var(--color-text) 10%,transparent);overflow:hidden"><div style="{{ r.me.hpBar }}"></div></div>
        <div style="height:2px;border-radius:1px;background:color-mix(in srgb,var(--color-text) 10%,transparent);overflow:hidden"><div style="{{ r.me.eBar }}"></div></div>
      </div>
      <sc-if value="{{ r.me.hasTimer }}"><div style="display:flex;gap:4px;align-items:center;font-size:10.5px;color:color-mix(in srgb,var(--color-text) 65%,transparent)"><i class="ph ph-timer" style="font-size:12px"></i>{{ r.me.timer }}</div></sc-if>
    </div>
    <div style="display:flex;flex-direction:column;gap:5px;min-width:0">
      <sc-if value="{{ r.opp.has }}" hint-placeholder-val="{{ true }}">
        <div style="{{ r.opp.box }}">
          <sc-if value="{{ r.opp.hasSpr }}"><img src="{{ r.opp.spr }}" alt="" style="width:32px;height:32px;margin:-9px -4px -9px -6px;flex:none;object-fit:contain"></sc-if>
          <sc-if value="{{ r.opp.hasDot }}"><span style="{{ r.opp.dot }}"></span></sc-if>
          <sc-if value="{{ r.opp.hasIcon }}"><i class="{{ r.opp.icon }}" style="font-size:15px;flex:none"></i></sc-if>
          <span style="font-size:12.5px;font-weight:500;line-height:1.25">{{ r.opp.title }}</span>
        </div>
      </sc-if>
      <sc-if value="{{ r.opp.hasSub }}"><div style="font-size:11px;line-height:1.3;color:color-mix(in srgb,var(--color-text) 65%,transparent)">{{ r.opp.sub }}</div></sc-if>
      <sc-if value="{{ r.opp.hasFaint }}"><div style="display:flex;gap:4px;align-items:center;font-size:11px;color:color-mix(in srgb,var(--color-text) 80%,transparent)"><i class="ph ph-x-circle" style="font-size:13px"></i>{{ r.opp.faint }}</div></sc-if>
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="display:flex;justify-content:space-between;gap:6px;font-size:10.5px;font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--color-text) 60%,transparent)"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.opp.mon }}</span><span style="white-space:nowrap">{{ r.opp.nums }}</span></div>
        <div style="height:4px;border-radius:2px;background:color-mix(in srgb,var(--color-text) 10%,transparent);overflow:hidden"><div style="{{ r.opp.hpBar }}"></div></div>
        <div style="height:2px;border-radius:1px;background:color-mix(in srgb,var(--color-text) 10%,transparent);overflow:hidden"><div style="{{ r.opp.eBar }}"></div></div>
      </div>
      <sc-if value="{{ r.opp.hasTimer }}"><div style="display:flex;gap:4px;align-items:center;font-size:10.5px;color:color-mix(in srgb,var(--color-text) 65%,transparent)"><i class="ph ph-timer" style="font-size:12px"></i>{{ r.opp.timer }}</div></sc-if>
    </div>
  </div>
  <sc-if value="{{ r.hasMark }}">
    <a href="{{ r.mark.href }}" style="display:flex;align-items:center;gap:6px;align-self:flex-start;margin-left:64px;padding:4px 8px;border-radius:6px;border:1px solid var(--color-accent-700);font-size:11.5px;text-decoration:none;color:var(--color-accent-300)" style-hover="background:var(--color-accent-900)"><i class="{{ r.mark.icon }}" style="font-size:14px"></i>{{ r.mark.txt }}</a>
  </sc-if>
  <sc-if value="{{ r.hasGloss }}">
    <div style="display:flex;gap:8px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--color-text) 5%,transparent);font-size:11.5px;line-height:1.45;color:color-mix(in srgb,var(--color-text) 85%,transparent)"><i class="ph ph-info" style="font-size:14px;margin-top:2px;flex:none"></i><span><b style="font-weight:600">{{ r.gloss.term }}</b> {{ r.gloss.text }}</span></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:140},&quot;r&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
